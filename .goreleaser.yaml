version: 2
project_name: sliplane

builds:
  - id: sliplane
    main: ./cmd/sliplane
    binary: sliplane
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w -X github.com/sliplane/cli/internal/buildinfo.Version={{ .Version }} -X github.com/sliplane/cli/internal/buildinfo.Commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Fixed metadata makes archives byte-for-byte reproducible, so maintainers
    # can rebuild a release locally before signing its checksums.
    builds_info:
      mtime: "{{ .CommitDate }}"
      mode: 0755
      owner: root
      group: root
    files:
      - src: LICENSE
        info: &file_info
          mtime: "{{ .CommitDate }}"
          mode: 0644
          owner: root
          group: root
      - src: NOTICE
        info: *file_info

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The maintainer signature on checksums.txt then covers the installer too.
  extra_files:
    - glob: scripts/install.sh

release:
  github:
    owner: sliplane
    name: cli
  draft: true
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh

changelog:
  sort: asc
